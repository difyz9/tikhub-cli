[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tikhub-cli"
version = "0.1.0"
description = "TikHub API CLI — 搜索、下载、帧提取一条龙"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "click>=8.1",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]
link = ["yt-dlp>=2025.1,<2027", "requests>=2.31,<3"]
douyin = ["playwright>=1.45,<2", "requests>=2.31,<3"]
full = ["tikhub-cli[link,douyin]"]

[project.scripts]
tikhub = "tikhub_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["tikhub_cli"]
